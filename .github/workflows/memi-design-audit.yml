name: memi design audit

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  read-only-design-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # releases/v4, 2026-07-16

      - name: Verify restricted upstream media is absent
        shell: bash
        run: |
          set -euo pipefail
          test ! -e docs/media/github-cover.jpg
          test ! -e ripple/Assets.xcassets/image_2.imageset/image-2.jpg
          test -s ripple/Assets.xcassets/palm_tree.imageset/image.png
          test -s ripple/Assets.xcassets/image_2.imageset/image-2.png

      - name: Run pinned memi design audit
        uses: sarveshsea/memi@ee3f3f00731a7a08c7616d4dfb14440165a86354 # first-run audits are non-invasive
        with:
          version: "2.6.2"
          fail-on: none
          report: "true"
          upload-sarif: "false"
